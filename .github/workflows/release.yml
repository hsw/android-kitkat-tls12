# Release on a tag vN: the full build on GitHub-hosted runners (build.yml with the tag as release name), then the
# recovery zips, the jar patcher zip and their SHA256SUMS go to the GitHub release of that tag. Nothing is built or
# uploaded elsewhere.
name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: ${{ github.ref_name }}
      cold: true   # no caches: the zips come from a build of nothing but the tag, as a local rebuild
    permissions:
      contents: read
      packages: write

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # only the artifact zips (the release set: every zip mkzips.sh writes, kktls-jarpatch included)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zips
          path: dist
      - name: check
        run: |
          cd dist
          sha256sum -c --strict SHA256SUMS
          # every file is listed, nothing else is uploaded
          n=0; for f in *; do [ "$f" = SHA256SUMS ] || n=$((n + 1)); done
          [ "$n" = "$(wc -l < SHA256SUMS)" ]
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "Recovery zips and the jar patcher (kktls-jarpatch) built by the release workflow from $TAG ($GITHUB_SHA). Check them with SHA256SUMS."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
